name: deenruv-local
services:
    deenruv-postgres:
        image: ghcr.io/cloudnative-pg/postgresql:16.3
        hostname: deenruv-postgres
        container_name: deenruv-postgres
        environment:
            POSTGRES_USER: deenruv
            POSTGRES_PASSWORD: deenruv
            POSTGRES_DB: deenruv
        ports:
            - 60432:5432
        expose:
            - 5432
        volumes:
            - ./initdb:/docker-entrypoint-initdb.d
    deenruv-redis:
        image: redis:7.2
        hostname: deenruv-redis
        container_name: deenruv-redis
        ports:
            - 60379:6379
        expose:
            - 6379
    deenruv-minio:
        image: 'minio/minio:latest'
        hostname: deenruv-minio
        container_name: deenruv-minio
        ports:
            - 60900:9000
            - 60901:9090
        expose:
            - 9000
            - 9090
        environment:
            MINIO_ROOT_USER: 'root'
            MINIO_ROOT_PASSWORD: 'password'
        command: minio server /data/minio --console-address ":9090"
